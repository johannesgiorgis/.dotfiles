name: CI Tests
on:
  push:
    branches:
      - main
    paths:
      - "bin/**"
      - ".github/workflows/**yml"
      - "**.sh"
      - "**zsh"
      - "**.zshrc"
      - "roles/**"
      - "group_vars/**"
      - "dotfiles.yml"
      - "hosts"
      - "requirements.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        # only scan files in `bin/` ignoring icalBuddy file (since its an executable)
        with:
          scandir: "./bin"
          ignore_names: >-
            icalBuddy

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install ansible + ansible-lint
        run: pip install ansible ansible-lint

      # runs the exact same `make lint` a developer runs locally - single
      # source of truth for which checks run, nothing to keep in sync.
      - name: Lint
        run: make lint

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      # don't cancel the other OS leg if one fails - want full signal from both
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check versions of pre-installed software/system
        run: ./.cisupport/pre.sh

      - name: Install and verify packages are installed
        working-directory: bin
        run: |
          pwd
          bash doi -t taskwarrior
          command -v ansible
          command -v task

      - name: Install zsh (Ubuntu) # Runs faster than MacOS
        if: matrix.os == 'ubuntu-latest'
        working-directory: bin
        run: |
          bash doi -t zsh
          echo "TESTING FILES"
          test -f $HOME/zsh/.zshrc
          test -f $HOME/.p10k.zsh
          test -f $HOME/.zshenv
          echo "TESTING COMMANDS"

      - name: Verify zsh (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: zsh {0}
        run: |
          source $HOME/zsh/.zshrc
          echo "POST exec zsh"
          command -v p10k

      - name: Check installed versions
        run: ./.cisupport/post.sh
