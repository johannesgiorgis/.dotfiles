---
# main task for spotify

- name: SPOTIFY - Install for Darwin
  when: ansible_os_family == "Darwin"
  homebrew_cask:
    name: spotify
    state: present

- name: SPOTIFY - Install for Linux
  when: ansible_os_family in ["Debian"]
  become: "{{ should_be_root }}"
  block:

    - name: Install Spotify repository (apt)
      when: ansible_os_family in ["Debian"]
      ansible.builtin.deb822_repository:
        name: spotify
        types: deb
        uris: http://repository.spotify.com
        suites: stable
        components: non-free
        signed_by: https://download.spotify.com/debian/pubkey_6224F9941A8AA6D1.gpg
        state: present

    - name: Install Spotify (apt)
      when: ansible_os_family in ["Debian"]
      apt:
        name: spotify-client
        state: present
        update_cache: true
