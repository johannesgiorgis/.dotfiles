---
# debian task for sublime-text

- name: sublime-text is present for debian system
  block:
    - name: Install dependencies for Sublime Text
      apt:
        name:
          - apt-transport-https
        state: present

    - name: Install Sublime Text repository
      ansible.builtin.deb822_repository:
        name: sublime-text
        types: deb
        uris: https://download.sublimetext.com/
        suites: apt/stable/
        signed_by: https://download.sublimetext.com/sublimehq-pub.gpg
        state: present

    - name: Install Sublime Text
      apt:
        name: sublime-text
        state: present
        update_cache: true
