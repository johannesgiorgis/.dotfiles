---
# main task for sublime-merge

- name: Install Sublime Merge (brew-cask)
  when: ansible_os_family == "Darwin"
  homebrew_cask:
    name: sublime-merge
    state: present


- name: sublime-merge is present for debian system
  become: "{{ should_be_root }}"
  when: ansible_os_family in ["Debian"]
  block:
    - name: Install dependencies for Sublime Merge
      apt:
        name:
          - apt-transport-https
        state: present

    - name: Install Sublime Merge repository
      ansible.builtin.deb822_repository:
        name: sublime-merge
        types: deb
        uris: https://download.sublimetext.com/
        suites: apt/stable/
        signed_by: https://download.sublimetext.com/sublimehq-pub.gpg
        state: present

    - name: Install Sublime Merge
      apt:
        name: sublime-merge
        state: present
        update_cache: true
