---
# main task for youtube-dl
# NOTE: youtube-dl's own formula was removed from homebrew-core (development stalled
# upstream) - this role now installs yt-dlp, the actively maintained fork, instead.
# Keeping the role/tag name as `youtube-dl` to avoid churning tags/docs that reference it.

- name: yt-dlp and dependencies are present
  become: "{{ should_be_root }}"

  block:
    - name: ffmpeg is present
      when: ansible_pkg_mgr != 'homebrew'
      package:
        name: ffmpeg
        state: latest

    - name: Tap homebrew-ffmpeg/ffmmpeg (homebrew)
      when: ansible_pkg_mgr == 'homebrew'
      homebrew_tap:
        tap: homebrew-ffmpeg/ffmpeg
        state: present

    - name: homebrew-ffmpeg/ffmpeg/ffmpeg is present (homebrew)
      when: ansible_pkg_mgr == 'homebrew'
      homebrew:
        name: homebrew-ffmpeg/ffmpeg/ffmpeg
        state: head
        install_options: with-fdk-aac

    - name: atomicparsley is present
      package:
        name: atomicparsley
        state: latest

    - name: yt-dlp is present
      package:
        name: yt-dlp
        state: latest
