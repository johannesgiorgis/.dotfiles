---
# main task for asdf
# asdf v0.16+ is a compiled Go binary (no more shims-via-bash-install) -
# https://asdf-vm.com/guide/upgrading-to-v0-16.html

- name: ASDF - present for MacOS via homebrew
  when: ansible_pkg_mgr == 'homebrew'
  homebrew:
    name: asdf
    state: present

- name: ASDF - Getting latest version from Github API
  when: ansible_pkg_mgr == 'apt'
  shell: >
    curl -s https://api.github.com/repos/asdf-vm/asdf/releases/latest
    | jq -r '.tag_name'
  register: output

- name: ASDF - Clone asdf repository {{ output.stdout }}
  when: ansible_pkg_mgr == 'apt'
  git:
    repo: https://github.com/asdf-vm/asdf.git
    dest: "~/.asdf"
    version: "{{ output.stdout }}"
